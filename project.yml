name: PersonalContext
options:
  bundleIdPrefix: com.ethanfox
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: NUF99UVUKB
    ENABLE_HARDENED_RUNTIME: YES
    COMBINE_HIDPI_IMAGES: YES
packages:
  swift-markdown-ui:
    url: https://github.com/gonzalezreal/swift-markdown-ui.git
    from: 2.4.1
targets:
  PersonalContext:
    type: application
    platform: macOS
    sources:
      - path: PersonalContext
    dependencies:
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: LinkPresentation.framework
      - package: swift-markdown-ui
        product: MarkdownUI
      - target: PersonalContextMCP
        embed: true
        codeSign: true
        copy:
          destination: executables
    postBuildScripts:
      - name: Build agent runner
        script: sh "$SRCROOT/PersonalContextRunner/build.sh"
        inputFiles:
          - $(SRCROOT)/PersonalContextRunner/runner.ts
          - $(SRCROOT)/PersonalContextRunner/source-read.ts
          - $(SRCROOT)/PersonalContextRunner/package.json
          - $(SRCROOT)/PersonalContextRunner/bun.lock
          - $(SRCROOT)/PersonalContextRunner/runner.entitlements
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/slate-node
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/runner/runner.mjs
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/runner/source-read.mjs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethanfox.PersonalContext
        PRODUCT_NAME: Slate
        PRODUCT_MODULE_NAME: Slate
        ASSETCATALOG_COMPILER_APPICON_NAME: Slate
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Slate
        INFOPLIST_KEY_CFBundleName: Slate
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Slate reads your Calendar and Reminders so it can show and add events and tasks on this Mac.
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: Slate reads your Calendar and Reminders so it can show and add events and tasks on this Mac.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    entitlements:
      path: PersonalContext/PersonalContext.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /Library/Application Support/Cursor/User/globalStorage/
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.ethanfox.PersonalContext
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.ethanfox.PersonalContext

  PersonalContextMCP:
    type: tool
    platform: macOS
    sources:
      - path: PersonalContextMCP
      - path: PersonalContext/Models/Records.swift
      - path: PersonalContext/Models/Store.swift
      - path: PersonalContext/Services/ContextBuilder.swift
      - path: PersonalContext/App/TextFormat.swift
    settings:
      base:
        PRODUCT_NAME: slate-mcp
        PRODUCT_BUNDLE_IDENTIFIER: com.ethanfox.PersonalContext.mcp
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
    entitlements:
      path: PersonalContextMCP/PersonalContextMCP.entitlements
      properties:
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.ethanfox.PersonalContext

  PersonalContextTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PersonalContextTests
    dependencies:
      - target: PersonalContext
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethanfox.PersonalContextTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Slate.app/Contents/MacOS/Slate
        BUNDLE_LOADER: $(TEST_HOST)
